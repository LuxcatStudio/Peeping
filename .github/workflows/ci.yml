name: CI - Build and Publish

on:
  push:
    branches: [ main ]
    tags: ['v*.*.*']
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Restore
      run: dotnet restore Peeping.csproj

    - name: Build
      run: dotnet build Peeping.csproj -c Release --no-restore

    - name: Publish
      run: |
        dotnet publish Peeping.csproj -c Release -r win-x64 --self-contained false -p:PublishTrimmed=false -o ./artifacts/publish

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: peeping-windows-x64
        path: artifacts/publish

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: peeping-windows-x64
        path: downloaded

    - name: Create release folder
      run: mkdir -p release

    - name: Compress artifact
      run: zip -r release/peeping-windows-x64.zip downloaded/*

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Fetch tags
      run: git fetch --tags --prune

    - name: Compute changelog
      id: changelog
      run: |
        CURRENT_TAG=${GITHUB_REF_NAME}
        PREV_TAG=$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || git describe --tags --abbrev=0 --match 'v*.*.*' $(git rev-list --tags --max-count=1) 2>/dev/null || echo "")
        if [ -n "$PREV_TAG" ]; then
          RANGE="$PREV_TAG..${GITHUB_SHA}"
          LOG=$(git log $RANGE --pretty=format:"- %s (%an)" --no-merges)
        else
          LOG=$(git log -n 50 --pretty=format:"- %s (%an)" --no-merges)
        fi
        echo "body<<EOF" >> $GITHUB_OUTPUT
        echo "$LOG" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        release_name: ${{ github.ref_name }}
        draft: true
        prerelease: false
        body: ${{ steps.changelog.outputs.body }}

    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: release/peeping-windows-x64.zip
        asset_name: peeping-windows-x64.zip
        asset_content_type: application/zip
